<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in - Lab Login App</title>
  <style>
    :root {
      --brand: #4f46e5;
      --brand-dark: #4338ca;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --ok: #047857;
      --ok-bg: #ecfdf5;
      --err: #b91c1c;
      --err-bg: #fef2f2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1100px 600px at 10% -10%, #c7d2fe 0%, transparent 55%),
        radial-gradient(900px 500px at 110% 110%, #bae6fd 0%, transparent 55%),
        #f8fafc;
      padding: 24px;
    }
    .card {
      width: min(420px, 100%);
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 24px 60px -24px rgba(15, 23, 42, .35);
    }
    .logo {
      width: 46px; height: 46px;
      display: grid; place-items: center;
      border-radius: 13px;
      background: linear-gradient(135deg, var(--brand), #06b6d4);
      color: #fff; font-weight: 700; font-size: 19px;
      margin-bottom: 18px;
    }
    h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: -.02em; }
    .sub { margin: 0 0 26px; color: var(--muted); font-size: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 7px; }
    .field { margin-bottom: 16px; }
    input {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 15px;
      color: var(--ink);
      background: #f8fafc;
      transition: border-color .15s, box-shadow .15s, background .15s;
    }
    input:focus {
      outline: none;
      background: #fff;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, .18);
    }
    button {
      width: 100%;
      margin-top: 6px;
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      background: var(--brand);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, transform .05s;
    }
    button:hover { background: var(--brand-dark); }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: .7; cursor: progress; }
    #message {
      margin-top: 16px;
      padding: 11px 13px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.4;
      display: none;
    }
    #message.show { display: block; }
    #message[data-status="success"] { background: var(--ok-bg); color: var(--ok); }
    #message[data-status="error"] { background: var(--err-bg); color: var(--err); }
    .hint {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px dashed var(--line);
      font-size: 12.5px;
      color: var(--muted);
      text-align: center;
    }
    code {
      background: #f1f5f9;
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 1px 5px;
      font-size: 12px;
      color: var(--ink);
    }
    .foot { margin-top: 14px; text-align: center; font-size: 11.5px; color: #94a3b8; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">L</div>
    <h1>Welcome back</h1>
    <p class="sub">Sign in to the containerized Lab Login App</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username"
               placeholder="admin" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password"
               placeholder="Enter your password" required />
      </div>
      <button id="loginBtn" type="submit">Sign in</button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <p class="hint">Demo credentials: <code>admin</code> / <code>admin123</code></p>
    <p class="foot">Lab External &middot; Java + Docker + Jenkins + Selenium</p>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginBtn");

    function showMessage(text, status) {
      message.textContent = text;
      message.dataset.status = status;
      message.classList.add("show");
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      if (!username || !password) {
        showMessage("Please enter both username and password.", "error");
        return;
      }

      button.disabled = true;
      button.textContent = "Signing in...";

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();
        showMessage(
          data.message || (response.ok ? "Login successful" : "Login failed"),
          response.ok && data.success ? "success" : "error"
        );
        document.body.dataset.auth = response.ok && data.success ? "authenticated" : "guest";
      } catch (error) {
        showMessage("Unable to reach the server. Please try again.", "error");
      } finally {
        button.disabled = false;
        button.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
